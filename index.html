<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f7a3d">
<title>Samridhis Garden Store - Payment</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f3;font-family:Arial,sans-serif;color:#17351f}
.card{max-width:460px;margin:25px auto;padding:25px 20px;background:#fff;border-radius:20px;box-shadow:0 4px 25px #0001;text-align:center}
h1{font-size:25px;margin:0 0 6px}
.sub{color:#68746c;margin:0 0 20px}
.amount{font-size:34px;font-weight:800;margin:15px 0}
.pay{display:block;background:#1f7a3d;color:#fff;text-decoration:none;padding:16px;border-radius:12px;font-size:19px;font-weight:800}
#qr{width:280px;height:280px;margin:20px auto 5px;border:8px solid white;max-width:100%}
.upi{font-size:14px;color:#68746c}
.payee{font-size:14px;color:#68746c;margin-top:6px}
.note{font-size:13px;color:#68746c;line-height:1.5;margin-top:18px}
.err{color:#b42318;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h1>SAMRIDHIS GARDEN STORE</h1>
<p class="sub">Secure UPI Payment</p>
<div id="content">Loading payment details...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script>
const DEFAULT_UPI="Psrdhar@okicici";
const DEFAULT_PAYEE="PEESAPATY SRIDHAR";

const p=new URLSearchParams(location.search);
const amount=parseFloat(p.get("amount"));
const customer=p.get("customer")||"";
const upi=p.get("upi")||DEFAULT_UPI;
const payee=p.get("payee")||(
  upi.toLowerCase()==="psrdhar@okicici" ? DEFAULT_PAYEE :
  upi.toLowerCase()==="lakshmisruchulu@oksbi" ? "SUNDARA LAKSHMI PEESAPATY" :
  ""
);

if(!amount || amount<=0){
  document.getElementById("content").innerHTML='<div class="err">Invalid payment amount.</div>';
}else if(!payee){
  document.getElementById("content").innerHTML='<div class="err">Payee name is missing.</div>';
}else{
  const uri="upi://pay?pa="+encodeURIComponent(upi)
    +"&pn="+encodeURIComponent(payee)
    +"&am="+amount.toFixed(2)
    +"&cu=INR";

  document.getElementById("content").innerHTML=
    '<div>Order for '+escapeHtml(customer)+'</div>'+
    '<div class="amount">₹'+amount.toFixed(2)+'</div>'+
    '<a class="pay" href="'+uri+'">💳 Pay ₹'+amount.toFixed(2)+' Now</a>'+
    '<canvas id="qr"></canvas>'+
    '<div class="upi">UPI: '+escapeHtml(upi)+'</div>'+
    '<div class="payee">Payee: '+escapeHtml(payee)+'</div>'+
    '<div class="note">Tap the button to open a compatible UPI app, or scan the QR code with another phone.</div>';

  new QRious({
    element:document.getElementById("qr"),
    value:uri,
    size:280,
    level:"H"
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m];
  });
}
</script>
</body>
</html>
